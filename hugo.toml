baseURL = "https://joor0x.github.io/"
languageCode = "en-us"
title = "Joor0x - Developer & Algorithmic Trader"
theme = "PaperMod"
# Turn on if you want to show drafts
# buildDrafts = true  

[params]
  # Name of your site/brand
  author = "Joor0x"
  description = "Notes on algorithmic trading, privacy, Linux and productivity."
  keywords = ["trading", "privacy", "linux", "productivity", "cybersecurity", "self-hosting"]

  # Default to the dark, terminal-inspired theme
  defaultTheme = "dark"
  disableThemeToggle = false

  # Reading experience
  ShowReadingTime = true
  ShowWordCount = false
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false

  # Homepage hero
  [params.homeInfoParams]
    Title = "Build systems that learn. Keep them private."
    Content = """
Notes from a developer & algorithmic trader on **trading**, **privacy**, **Linux** and **productivity** — autonomous systems, self-hosting, and tools worth keeping.
"""

  [params.label]
    text = "joor0x"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/joor0x"
  title = "GitHub"

[menu]

  [[menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 1

  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about"
    weight = 2

  [[menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/posts"
    weight = 3

[services]
  [services.googleAnalytics]
    ID = "G-DQ8LLMPBBF"
